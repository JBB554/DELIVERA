<!DOCTYPE html>
<html lang="fr">
<head>

<title>DELIVERA — Hors ligne</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#FAFAF8;font-family:'DM Sans',sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px}
.logo{font-size:42px;font-weight:900;letter-spacing:-2px;color:#C9A84C}

.msg{font-size:14px;color:#A8A89A;line-height:1.6;margin-top:8px}
.btn{margin-top:20px;padding:13px 28px;background:#C9A84C;color:#0A0A0A;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div>
  <div class="logo">DELIVERA</div>
  <div class="sub">Toutes tes boutiques</div>
</div>
<div class="msg">
  Pas de connexion pour le moment.<br>
  <span style="color:#606058;font-size:12px">No connection right now.</span>
</div>
<button class="btn" onclick="location.reload()">Réessayer / Retry</button>
</body>
